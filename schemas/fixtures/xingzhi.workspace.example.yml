# Example workspace config for her-dock Agent Workbench.
# Place as xingzhi.yml at the workspace root.
version: 1
name: northlake-crm
defaultProvider: codex
defaultKind: mixed
autoExecute: ask_risky
rules:
  - rules/**/*.md
  - AGENTS.md
skills: []
writeAllow:
  - out/**
  - agents/**
analysis:
  dataGlobs:
    - data/**/*
  outputDir: out
coding:
  testCommand: pnpm test
